[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

[lint]
exclude_lints = [
    "mixed-case-function", 
    "asm-keccak256", 
    "screaming-snake-case-immutable", 
    "mixed-case-variable"
]

[dependencies]
forge-std = "1.14.0"
"@openzeppelin-contracts" = "5.3.0"

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"
eth_sepolia = "${ETH_RPC_URL}"

[etherscan]
arc_testnet = { key = "${ARC_EXPLORER_API_KEY}", url = "${ARC_EXPLORER_API_URL}" }
