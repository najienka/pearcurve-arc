[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
# Arc Testnet Arachnid CREATE2 factory (same vanity address as most EVMs)
create2_deployer = "0x4e59b44847b379578588920cA78FbF26c0B4956C"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
exclude_lints = [
    "mixed-case-function", 
    "asm-keccak256", 
    "screaming-snake-case-immutable", 
    "mixed-case-variable"
]

[dependencies]
forge-std = "1.14.0"
"@openzeppelin-contracts" = "5.3.0"

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"
eth_sepolia = "${ETH_RPC_URL}"

[etherscan]
arc_testnet = { key = "${ARC_EXPLORER_API_KEY}", url = "https://testnet.arcscan.app/api" }
