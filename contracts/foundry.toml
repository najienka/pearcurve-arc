[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"
eth_sepolia = "${ETH_RPC_URL}"

[etherscan]
arc_testnet = { key = "${ARC_EXPLORER_API_KEY}", url = "${ARC_EXPLORER_API_URL}" }
